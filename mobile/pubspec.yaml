name: auralinks_mobile
description: AuraLinks Enterprise Mobile Application for field professionals.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.4.3

  # Local Storage & Security
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.1

  # Navigation
  go_router: ^14.2.0

  # GPS & Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # QR Scanner
  mobile_scanner: ^5.2.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # UI Utilities
  intl: ^0.19.0
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
